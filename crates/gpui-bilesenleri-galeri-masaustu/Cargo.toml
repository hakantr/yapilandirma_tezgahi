[package]
name = "gpui-bilesenleri-galeri-masaustu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gerçek pencerede `input-to-present` ölçümü.
#
# `gpui/profiler` açılınca pencere girdi gecikmesi, çizim süresi ve sunum
# aralığı histogramlarını toplar. Ürün profiline girmez: bayrak yalnız
# ölçüm koşumunda verilir.
#
#     cargo run --profile akici-dev --features olcum \
#         -p gpui-bilesenleri-galeri-masaustu -- --olcum 20
#
# Tüketici ablation'ı kullanıcı girdisi istemez; yaşayan alanı gerçek
# giriş yolundan programatik değiştirir:
#
#     cargo run --release --features olcum-izleyici \
#         -p gpui-bilesenleri-galeri-masaustu -- --geniş --olcum-izleyici 80
#
# Tezgâhın tamamı ile tek `GirişKutusu` kökünü aynı otomatik yükte ölçmek:
#
#     cargo run --release --features olcum-izleyici \
#         -p gpui-bilesenleri-galeri-masaustu -- --geniş --olcum-giris 20
#     cargo run --release --features olcum-izleyici \
#         -p gpui-bilesenleri-galeri-masaustu -- \
#         --geniş --minimal-giris --olcum-giris 20
#
# Sol kolonun olağan flex-scroll ve `ListState` sanallaştırmasını aynı
# otomatik yükte, üst/orta/son kaydırma konumlarında karşılaştırmak:
#
#     cargo run --release --features olcum-izleyici \
#         -p gpui-bilesenleri-galeri-masaustu -- \
#         --geniş --olcum-giris 20 --sol-konum orta --sanal-sol-liste
olcum = ["gpui/profiler", "dep:hdrhistogram"]
olcum-izleyici = [
    "olcum",
    "gpui-bilesenleri-galeri/olcum-izleyici",
]

[dependencies]
hdrhistogram = { version = "7", optional = true }
gpui.workspace = true
# `wayland`/`x11` Linux pencere arka uçlarıdır; onlarsız Linux'ta galeri
# açılmıyor (kullanıcı kararı, Ağu 2026). macOS/Windows'ta hedef kapılı
# oldukları için etkisizdirler.
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui-bilesenleri-galeri.workspace = true
