[package]
name = "gpui-bilesenleri-galeri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gerçek-pencere izleyici ablation'ı. Normal ürün derlemesinde callback
# yollarına deney bayrağı ya da sayaç maliyeti eklenmez; masaüstü ölçüm
# özelliği bunu yalnız ölçüm binary'sine taşır.
olcum-izleyici = []

# Ölçüm tabanı: sağ kolonun önbelleğini kapatır.
#
# Önbellekli/önbelleksiz karşılaştırması elle düzenlemeyle değil bu
# bayrakla alınır — aynı makinede iki koşum, aynı kod:
#
#     KARE_OLCUM=1 cargo test --profile akici-dev -p gpui-bilesenleri-galeri \
#         --test kare_olcumu -- --nocapture
#     KARE_OLCUM=1 cargo test --profile akici-dev -p gpui-bilesenleri-galeri \
#         --features olcum-onbelleksiz --test kare_olcumu -- --nocapture
#
# Bayrak yalnız ölçüm içindir; ürün profiline girmez ve açıkken
# `kolon_tazeligi` kazanç kapıları bilinçli olarak atlanır.
olcum-onbelleksiz = []

[dependencies]
gpui.workspace = true
gpui-bilesenleri.workspace = true
gpui-bilesenleri-kabuk.workspace = true
# `ORT-002` edinme kökü ve `ORT-021` mühürlü çözüm hizmeti yalnız temel
# sandıktan dışa açılır; uygulama-kökü hizmet sahipliği buradan kurulur.
gpui-bilesenleri-temel.workspace = true

# `ORT-018` ölçümü tarayıcıda `performance.now()` okur; yalnız WASM
# hedefinde bağlanır, masaüstü profiline girmez.
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }

# Galeri render yolunu gerçek GPUI penceresinde koşturmak için yalnız test
# profilinde gerekir; WASM çalışma profiline transitif olarak giremez.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# Kare ölçüm koşumu (`tests/kare_olcumu.rs`) gerçek metin sistemiyle koşar:
# Noop shaping, kare maliyetinin metin payını sıfır gösterirdi. Cosmic saf
# Rust'tır ve macOS ile Linux'ta aynı shaping'i verir — iki hedefin
# sayıları karşılaştırılabilir kalır. Yalnız test profilinde bağlanır.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui_wgpu = { path = "../../../gpui/crates/gpui_wgpu" }
