[workspace]
resolver = "2"
members = [
    "crates/gpui-bilesenleri-galeri",
    "crates/gpui-bilesenleri-galeri-masaustu",
    "crates/gpui-bilesenleri-galeri-wasm",
]
default-members = [
    "crates/gpui-bilesenleri-galeri",
    "crates/gpui-bilesenleri-galeri-masaustu",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
# YÖN-002 uyarınca UI temeli eş kaynak yerel GPUI çalışma ağacıdır.
gpui = { path = "../gpui/crates/gpui", default-features = false }
gpui_platform = { path = "../gpui/crates/gpui_platform", default-features = false }
gpui_web = { path = "../gpui/crates/gpui_web", default-features = false }
wasm-bindgen = "=0.2.127"

# Bileşen ailesi kardeş depodan gelir; tezgâh onun sözleşme uyumunu ölçer.
gpui-bilesenleri = { path = "../gpui_bilesenleri/crates/gpui-bilesenleri" }
gpui-bilesenleri-kabuk = { path = "../gpui_bilesenleri/crates/gpui-bilesenleri-kabuk" }
gpui-bilesenleri-galeri = { path = "crates/gpui-bilesenleri-galeri" }

# Akıcı geliştirme profili: tezgâhın elle denendiği koşumlar için.
# `dev` profili GPUI çizim yolunu optimizasyonsuz bırakıyor ve etkileşim
# yargısı (takılıyor mu?) yanlış çıkıyor; `release` ise derleme döngüsünü
# uzatıyor. Bağımlılıklar (GPUI dâhil) tam optimize edilir, çalışma ağacı
# hızlı derlenen hafif optimizasyonda kalır.
#
#     cargo run --profile akici-dev -p gpui-bilesenleri-galeri-masaustu
[profile.akici-dev]
inherits = "dev"
opt-level = 1

[profile.akici-dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
