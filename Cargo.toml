[workspace]
resolver = "2"
members = [
    "crates/gpui-bilesenleri-galeri",
    "crates/gpui-bilesenleri-galeri-masaustu",
    "crates/gpui-bilesenleri-galeri-wasm",
]
default-members = [
    "crates/gpui-bilesenleri-galeri",
    "crates/gpui-bilesenleri-galeri-masaustu",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.dependencies]
# YÖN-002 uyarınca UI temeli eş kaynak yerel GPUI çalışma ağacıdır.
gpui = { path = "../gpui/crates/gpui", default-features = false }
gpui_platform = { path = "../gpui/crates/gpui_platform", default-features = false }
gpui_web = { path = "../gpui/crates/gpui_web", default-features = false }
wasm-bindgen = "=0.2.127"

# Bileşen ailesi kardeş depodan gelir; tezgâh onun sözleşme uyumunu ölçer.
gpui-bilesenleri = { path = "../gpui_bilesenleri/crates/gpui-bilesenleri" }
gpui-bilesenleri-kabuk = { path = "../gpui_bilesenleri/crates/gpui-bilesenleri-kabuk" }
gpui-bilesenleri-galeri = { path = "crates/gpui-bilesenleri-galeri" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
